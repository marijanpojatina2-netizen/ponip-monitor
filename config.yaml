# ============================================================================
# PONIP Monitor v3 — config (VPS edition)
# ============================================================================

# Hitna jamčevina = dospijeće u sljedećih N dana
alert_jamcevina_dana: 7

# AI SCORING
# -----------
# Ako isključeno, skripta radi brže ali bez AI analize
scoring_enabled: true

# Max broj basic scoringa per run (batched po 15, pa 100 = ~7 claude poziva)
# Max plan daje cca 200 poziva po 5h — 100/dan je daleko ispod limita
max_basic_per_run: 100

# Max broj detailed scoringa per run (jedan-po-jedan, s web search, sporo)
# Jedan detailed = ~2 min. 10/dan = 20 min
max_detailed_per_run: 10

# Veličina batch-a za basic scoring
batch_size_basic: 8

# OVRHOVODITELJ FILTER (v4)
# --------------------------
# Detekcija ovrhovoditelja iz PDF-a "Poziv na sudjelovanje u EJD" (Javna
# objava) za dražbe koje prođu donje filtre. Kategorije iz
# ovrhovoditelji_oib.csv: agencija, banka, banka_ugasena, drzava;
# izvan liste: firma_ostalo / privatna_osoba / nepoznato.
ovrhovoditelj_filter:
  enabled: true
  # Za koje kategorije šaljemo obavijest (sekcija u emailu)
  obavijesti_za_kategorije: [agencija, banka, banka_ugasena, privatna_osoba, firma_ostalo, nepoznato]
  # RH/Porezna uglavnom za male dugove — prilagodljivo
  ignoriraj_kategorije: [drzava]
  # Max PDF-ova po runu (1 req/s; novi imaju prednost, ostalo backfill)
  max_pdf_po_runu: 40
  # Filtri nekretnine — samo dražbe koje ovo prolaze idu u PDF dohvat
  nekretnina:
    # ključne riječi se traže u opisu (vrsta u CSV-u je samo "nekretnina");
    # dijakritici nebitni (kuća == kuca), "stanje" se NE računa kao "stan"
    kljucne_rijeci: [stan, kuća, apartman]
    # vrijednosti kako ih vraća court_to_county() u monitor.py
    zupanije: [Istarska, Primorsko-goranska, Grad Zagreb i okolica]
    min_vrijednost_eur: 50000
    max_vrijednost_eur: null

# =============================================================================
# NAPOMENE
# =============================================================================
# - Threshold za detailed scoring je hardkodiran na 500k EUR u scorer.py
# - Ukupna ocjena se računa deterministički u scorer.py (WEIGHTS: roi 45%,
#   lokacija 35%, stanje 20% + FLAG_PENALTIES za pravne rizike;
#   "osoba stanuje" je samo informativan flag, ne utječe na ocjenu)
# - Penali vrijede samo za POTVRĐENE rizike — flagovi tipa "provjeriti: ..."
#   / "nepoznato..." su spekulativni i ne nose penal (v3.2)
# - score_roi se clampa u pojas izveden iz popusta od procjene (ROI_BANDS);
#   recommendation se uskladi s finalnom ocjenom (v3.2)
# - Svi rezultati se kešuju u scores/basic/*.json i scores/detailed/*.json
# - Re-scoring se okida samo ako se cijena ili opis promijeni (input_hash)
# - Na prvi run, backfill će ocijeniti top 100 (sortirano: nova > urgent > vrijednost)
#   Preostale će scoreati u idućim run-ovima, postupno kroz nekoliko dana
